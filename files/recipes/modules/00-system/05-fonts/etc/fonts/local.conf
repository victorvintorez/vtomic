<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
	<!-- Set default monospace font (Iosevka) -->
	<alias>
		<family>monospace</family>
		<prefer>
			<family>Iosevka</family>
			<family>Sarasa Mono</family>
			<family>Symbols Nerd Font</family>
			<family>Noto Color Emoji</family>
		</prefer>
	</alias>
	<!-- Set default sans-serif font (Iosevka Aile) -->
	<alias>
		<family>sans-serif</family>
		<prefer>
			<family>Iosevka Aile</family>
			<family>Sarasa Gothic</family>
			<family>Symbols Nerd Font</family>
			<family>Noto Color Emoji</family>
		</prefer>
	</alias>
	<!-- Set default serif font (Iosevka Etoile) -->
	<alias>
		<family>serif</family>
		<prefer>
			<family>Iosevka Etoile</family>
			<family>Sarasa Gothic Slab</family>
			<family>Symbols Nerd Font</family>
			<family>Noto Color Emoji</family>
		</prefer>
	</alias>
	<!-- Set default terminal font (Iosevka Term) -->
	<alias>
		<family>term</family>
		<prefer>
			<family>Iosevka Term</family>
			<family>Sarasa Term</family>
			<family>Symbols Nerd Font</family>
			<family>Noto Color Emoji</family>
		</prefer>
	</alias>
	<!-- Set default emoji font (Symbols Nerd Font) -->
	<alias>
		<family>emoji</family>
		<prefer>
			<family>Symbols Nerd Font</family>
			<family>Noto Color Emoji</family>
		</prefer>
	</alias>
</fontconfig>
