name: Generate ISO

on:
  workflow_run:
    workflows: ["Build Image"]
    branches: ["main"]
    types:
      - completed

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  titanoboa:
    name: Generate Installer ISO
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Maximize Build Space
        uses: ublue-os/remove-unwanted-software@v9

      - name: Checkout Repo
        uses: actions/checkout@v6

      - name: Mount BTRFS for podman storage
        id: container-storage-action
        uses: ublue-os/container-storage-action@911baca08baf30c8654933e9e9723cb399892140
        continue-on-error: true
        with:
          target-dir: /var/lib/containers
          mount-opts: compress-force=zstd:2

      - name: Generate ISO
        id: generate
        uses: osbuild/bootc-image-builder-action@main
        with:
          builder-image: ghcr.io/victorvintorez/bootc-image-builder:latest
          config-file: ./files/installer/config.toml
          image: ghcr.io/${{ github.repository }}-installer:br-system-43
          types: anaconda-iso
          rootfs: btrfs
          additional-args: --use-librepo

      - name: Rename and Checksum ISO
        run: |
          mkdir -p output
          mv ${{ steps.generate.outputs.output-directory }} output/vtomic-installer-$(date +%Y%m%d).iso
          (cd output && sha256sum vtomic-installer-$(date +%Y%m%d).iso | tee vtomic-installer-$(date +%Y%m%d).iso-CHECKSUM)

      - name: Upload ISO
        uses: actions/upload-artifact@v6
        with:
          name: installer-iso
          path: output/vtomic-installer-*.iso
