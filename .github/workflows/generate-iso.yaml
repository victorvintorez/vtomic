name: Generate ISO

on:
  workflow_run:
    workflows: ["Build Image"]
    branches: ["main"]
    types:
      - completed

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  titanoboa:
    name: Generate Installer ISO
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Maximize Build Space
        uses: ublue-os/remove-unwanted-software@v9

      - name: Checkout Repo
        uses: actions/checkout@v6

      - name: Generate ISO
        id: generate
        uses: ublue-os/titanoboa@main
        with:
          image-ref: ghcr.io/${{ github.repository }}-installer:br-system-43
          compression: erofs
          hook-post-rootfs: ${{ github.workspace }}/files/installer/configure-iso.sh

      - name: Rename and Checksum ISO
        run: |
          mkdir -p output
          mv ${{ steps.generate.outputs.iso-dest }} output/installer-$(date +%Y%m%d).iso
          (cd output && sha256sum installer-$(date +%Y%m%d).iso | tee installer-$(date +%Y%m%d).iso-CHECKSUM)

      - name: Upload ISO
        uses: actions/upload-artifact@v6
        with:
          name: installer-iso
          path: output/installer-*.iso

      - name: Upload Checksum
        uses: actions/upload-artifact@v6
        with:
          name: installer-checksum
          path: output/installer-*.iso-CHECKSUM
