# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
modules:
  - type: files
    files:
      - source: recipes/modules/00-system/11-firstboot
        destination: /

  - type: script
    snippets:
      - "chmod +x /var/usrlocal/bin/remove-setup-user.nu"
      - "chmod +x /var/usrlocal/bin/reset-container-policy.nu"
      - "chmod +x /var/usrlocal/bin/set-default-hostname.nu"

  - type: systemd
    system:
      enabled:
        - remove-setup-user.service
        - reset-container-policy.service
        - set-default-hostname.service
