# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
# Add default fonts
modules:
  - type: fonts
    fonts:
      nerd-fonts:
        - Iosevka
        - NerdFontsSymbolsOnly
      url-fonts:
        - name: Sarasa Gothic
          url: https://github.com/be5invis/Sarasa-Gothic/releases/download/v1.0.35/Sarasa-TTF-1.0.35.7z

  - type: dnf
    repos:
      cleanup: true
      copr:
        - peterwu/iosevka
    install:
      packages:
        - iosevka
        - iosevka-aile
        - iosevka-etoile

  - type: files
    files:
      - source: recipes/modules/00-system/05-fonts
        destination: /
