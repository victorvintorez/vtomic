# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
modules:
  - type: authselect
    source: local
    preset: local
    features:
      - with-systemd-homed

  - type: systemd
    system:
      enabled:
        - systemd-homed.service

  - type: files
    files:
      - source: recipes/modules/00-system/05-homed
        destination: /

  - type: script
    snippets:
      - "chmod +x /usr/local/bin/setup-homed-user.nu"

  - type: justfiles
    include:
      - modules/00-system/05-homed
