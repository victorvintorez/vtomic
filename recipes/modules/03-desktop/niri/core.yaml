# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
modules:
  - type: dnf
    install:
      packages:
        - niri
        - xwayland-satellite

  - type: script
    snippets:
      - "rm -rf /usr/share/doc/niri"
      - "rm -rf /usr/share/doc/just"

  - type: files
    files:
      - source: recipes/modules/03-desktop/niri/core
        destination: /
