# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
modules:
  - type: dnf
    install:
      packages:
        - cups
        - cups-filters
        - ipp-usb
        - bluez-cups
        - sane-backends
        - sane-airscan

  - type: systemd
    system:
      enabled:
        - cups.service
        - ipp-usb.service
