---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: vtomic-installer
description: This is a vtomic OS image for the ISO installer.

base-image: ghcr.io/ublue-os/base-main
image-version: 43

modules:
  # System Setup
  - from-file: modules/00-system/00-cleanup.yaml
  - from-file: modules/00-system/01-repos.yaml
  #- from-file: modules/00-system/02-bootloader.yaml
  - from-file: modules/00-system/03-akmods.yaml
  - from-file: modules/00-system/04-pam.yaml
  - from-file: modules/00-system/06-networking.yaml
  - from-file: modules/00-system/07-plymouth.yaml
  - from-file: modules/00-system/08-fonts.yaml
  - from-file: modules/00-system/09-osrelease.yaml
  - from-file: modules/00-system/10-xdgdirs.yaml
  - from-file: modules/00-system/11-firstboot.yaml
  - from-file: modules/00-system/12-files.yaml

  # Hardware Setup
  - from-file: modules/01-hardware/brightness.yaml
  - from-file: modules/01-hardware/keyboard.yaml

  # CLI Setup
  - from-file: modules/02-cli/bluetooth.yaml
  - from-file: modules/02-cli/btop.yaml
  - from-file: modules/02-cli/filemanager.yaml
  - from-file: modules/02-cli/misc.yaml
  - from-file: modules/02-cli/neovim.yaml
  - from-file: modules/02-cli/pipewire.yaml
  - from-file: modules/02-cli/shells.yaml
  - from-file: modules/02-cli/starship.yaml

  # Desktop Setup (common modules)
  - from-file: modules/03-desktop/common/portals.yaml
  - from-file: modules/03-desktop/common/terminal.yaml
  - from-file: modules/03-desktop/common/theme.yaml
  - from-file: modules/03-desktop/common/wayland.yaml

  # Desktop Setup (niri modules)
  - from-file: modules/03-desktop/niri/bar.yaml
  - from-file: modules/03-desktop/niri/core.yaml
  - from-file: modules/03-desktop/niri/polkit.yaml
  - from-file: modules/03-desktop/niri/wallpaper.yaml

  # Installer
  - type: files
    files:
      - source: recipes/recipe-installer
        destination: /

  - type: script
    snippets:
      - "chmod +x /var/usrlocal/bin/vtomic-installer.nu"
      - "mv /usr/share/wayland-sessions/niri.desktop /usr/share/wayland-sessions/sway-niri.desktop"

  - type: signing
